[package]
name = "mutinhimira"
version = "0.1.0"
description = "Mutinhimira Desktop Music Player"
authors = ["Mutinhimira Contributors"]
edition = "2021"

[lib]
name = "mutinhimira_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-full"] }
rusqlite_migration = "2.6"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
walkdir = "2"
rayon = "1.10"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
